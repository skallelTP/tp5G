# Usage étudiant :
#   docker compose up          -> JupyterLab sur http://localhost:8888
#   docker compose run --rm simu5g bash   -> terminal dans le conteneur
services:
  simu5g:
    image: ghcr.io/skalleltp/tp5g:2026
    # build: .                               # décommenter pour construire localement
    container_name: tp5g
    ports:
      - "8888:8888"
    volumes:
      - ./tp:/tp                             # les TP restent sur la machine de l'étudiant
    working_dir: /tp
    stdin_open: true
    tty: true
