# Construit l'image Docker sur les serveurs GitHub et la publie sur ghcr.io/skalleltp/tp5g
# Se lance : à chaque modification du Dockerfile ou des scripts, ou à la main (onglet Actions -> Run workflow)
name: build-image

on:
  push:
    paths: ["Dockerfile", "scripts/**", ".github/workflows/build.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - name: Libérer de l'espace disque sur le runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/skalleltp/tp5g:2026
            ghcr.io/skalleltp/tp5g:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
