# ============================================================================
#  TP4 — Mobilité et handover LTE (4G) : deux eNB reliées par X2
#  Réseau : simu5g.simulations.LTE.networks.MultiCell
#           eNodeB1 (x = 200 m) et eNodeB2 (x = 800 m), 4 UE : ue11, ue12, ue21, ue22
#  ue11 fait des allers-retours entre les deux eNB (LinearMobility, rebonds sur les bords
#  de son couloir [300 m, 700 m]) et reçoit un flux VoIP : à chaque traversée de la frontière
#  (x ≈ 500 m) un handover X2 doit avoir lieu. 120 s simulées : 3 traversées à 10 m/s.
#  Lancer :   tp-run AvecHO            (référence, 1 run)
#             tp-run SansHO            (même trajet, handover désactivé)
#             tp-run Vitesse 0..3      (3, 10, 20, 30 m/s)
#             tp-run Latence 0..3      (latence de handover 20, 50, 100, 200 ms)
#             tp-run Mesure 0..2       (période des mesures 0,2 / 0,5 / 1 s)
#  Exporter : tp-export results/AvecHO avecho.csv
#             tp-export-vec servingCell:vector results/AvecHO cell.csv   (trajectoire du handover)
# ============================================================================
[General]
print-undisposed = false
**.routingRecorder.enabled = false
**.sctp.**.scalar-recording = false
**.sctp.**.vector-recording = false
network = simu5g.simulations.LTE.networks.MultiCell
sim-time-limit = 120s
warmup-period  = 2s
repeat = 1
seed-set = ${repetition}
output-scalar-file = ${resultdir}/${configname}/run${runnumber}.sca
output-vector-file = ${resultdir}/${configname}/run${runnumber}.vec

# Vecteurs : seulement ceux de ue11 (cellule servante, distance, délai VoIP).
# Dans OMNeT++ la PREMIÈRE ligne qui correspond l'emporte : les règles spécifiques
# viennent AVANT la règle générale « tout à false ».
*.ue11.cellularNic.phy.servingCell.vector-recording = true
*.ue11.cellularNic.phy.distance.vector-recording = true
*.ue11.app[*].voIPFrameDelay.vector-recording = true
*.ue11.app[*].voIPReceivedThroughput.vector-recording = true
**.vector-recording = false

# --- Radio : cellules LTE 5 MHz, canal déterministe (pas de shadowing pour lire les courbes)
**.numBands = 25
**.rbAllocationType = "localized"
**.eNodeBTxPower = 40dBm
**.ueTxPower = 26dBm
**.targetBler = 0.01
**.cellularNic.channelModel[0].shadowing = false
**.cellularNic.channelModel[0].fading = false
**.cellularNic.channelModel[0].downlink_interference = true
**.mac.schedulingDisciplineDl = "PF"
**.mac.pfAlpha = 0.01

# --- Handover (paramètres Simu5G : mesure RSRP des broadcasts, hystérésis 10 % codée en dur)
**.cellularNic.phy.enableHandover = true
**.cellularNic.phy.handoverLatency = 50ms            # coupure UE : détachement (25 ms) + rattachement (25 ms)
*.eNodeB*.cellInfo.broadcastMessageInterval = 0.5s   # période des messages de mesure envoyés par les eNB

# --- X2 entre les deux eNB (requis pour le handover)
*.eNodeB*.numX2Apps = 1
*.eNodeB*.x2App[*].server.localPort = 5000 + ancestorIndex(1)
*.eNodeB1.x2App[0].client.connectAddress = "eNodeB2%x2ppp0"
*.eNodeB2.x2App[0].client.connectAddress = "eNodeB1%x2ppp0"
**.sctp.nagleEnabled = false
**.sctp.enableHeartbeats = false

# --- Rattachement initial
**.ue1*.macCellId = 1
**.ue1*.masterId  = 1
**.ue2*.macCellId = 2
**.ue2*.masterId  = 2

# --- Positions
**.mobility.initFromDisplayString = false
**.mobility.constraintAreaMinZ = 0m
**.mobility.constraintAreaMaxZ = 0m
*.eNodeB1.mobility.initialX = 200m
*.eNodeB1.mobility.initialY = 300m
*.eNodeB2.mobility.initialX = 800m
*.eNodeB2.mobility.initialY = 300m

# ue11 : mobile, va et vient entre x = 300 m et x = 700 m sur la ligne y = 320 m (aller = 400 m)
*.ue11.mobility.typename = "LinearMobility"
*.ue11.mobility.initialX = 300m
*.ue11.mobility.initialY = 320m
*.ue11.mobility.initialMovementHeading = 0deg
*.ue11.mobility.speed = 10mps
*.ue11.mobility.constraintAreaMinX = 300m
*.ue11.mobility.constraintAreaMaxX = 700m
*.ue11.mobility.constraintAreaMinY = 0m
*.ue11.mobility.constraintAreaMaxY = 600m

# ue12, ue21, ue22 : fixes, un trafic de fond léger pour que les cellules ne soient pas vides
*.ue12.mobility.typename = "StationaryMobility"
*.ue12.mobility.initialX = 250m
*.ue12.mobility.initialY = 250m
*.ue2*.mobility.typename = "StationaryMobility"
*.ue21.mobility.initialX = 750m
*.ue21.mobility.initialY = 250m
*.ue22.mobility.initialX = 820m
*.ue22.mobility.initialY = 350m
*.ue*.mobility.constraintAreaMinX = 0m
*.ue*.mobility.constraintAreaMaxX = 1000m
*.ue*.mobility.constraintAreaMinY = 0m
*.ue*.mobility.constraintAreaMaxY = 600m

# --- Trafic : VoIP descendant vers les 4 UE (ue11 est celui qu'on observe)
*.ue*.numApps = 1
*.server.numApps = 4
*.ue*.app[0].typename = "VoIPReceiver"
*.ue*.app[0].localPort = 3000
*.server.app[*].typename = "VoIPSender"
*.server.app[0].destAddress = "ue11"
*.server.app[1].destAddress = "ue12"
*.server.app[2].destAddress = "ue21"
*.server.app[3].destAddress = "ue22"
*.server.app[*].destPort = 3000
*.server.app[*].localPort = 3088 + ancestorIndex(0)
*.server.app[*].startTime = uniform(0s, 0.02s)
*.configurator.config = xmldoc("./demo.xml")

# ----------------------------------------------------------------------------
# Exercice 2 : référence avec handover
[Config AvecHO]

# Exercice 2 : même trajet, handover désactivé (ue11 reste accroché à eNodeB1)
[Config SansHO]
**.cellularNic.phy.enableHandover = false

# Exercice 3 : effet de la vitesse (4 runs)
[Config Vitesse]
*.ue11.mobility.speed = ${speed=3, 10, 20, 30}mps

# Exercice 4 : effet de la latence de handover (4 runs)
[Config Latence]
**.cellularNic.phy.handoverLatency = ${hoLatency=20, 50, 100, 200}ms

# Exercice 4 : effet de la période des mesures (3 runs)
[Config Mesure]
*.eNodeB*.cellInfo.broadcastMessageInterval = ${bcast=0.2, 0.5, 1.0}s
