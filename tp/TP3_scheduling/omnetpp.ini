# ============================================================================
#  TP3 — Scheduling LTE (4G) : MAXCI vs PF vs DRR — efficacité contre équité
#  Réseau : simu5g.simulations.LTE.networks.SingleCell
#  10 UE fixes alignés à distances croissantes de l'eNB (200 m → 2450 m), trafic CBR
#  descendant saturant : la cellule ne peut pas servir tout le monde, le
#  scheduler doit choisir.
#  Lancer :   tp-run Sched 0..2          (les 3 ordonnanceurs, 3 runs)
#             tp-run Charge 0..11        (3 ordonnanceurs x 4 charges)
#  Exporter : tp-export results/Sched sched.csv
# ============================================================================
[General]
print-undisposed = false
**.routingRecorder.enabled = false
**.vector-recording = false
sim-time-limit = 10s
warmup-period  = 2s
repeat = 1
seed-set = ${repetition}
output-scalar-file = ${resultdir}/${configname}/run${runnumber}.sca   # les valeurs des variables sont dans le fichier
output-vector-file = ${resultdir}/${configname}/run${runnumber}.vec

# --- Couche radio : cellule LTE 5 MHz
**.numBands = 25
**.rbAllocationType = "localized"
**.eNodeBTxPower = 40dBm
**.ueTxPower = 26dBm
**.targetBler = 0.01
**.fbPeriod = 12tti                    # rapport CQI toutes les 12 ms
**.mac.pfAlpha = 0.01                  # mémoire de la moyenne glissante PF (Simu5G : 0.95 par défaut = quasi sans mémoire)

**.mobility.constraintAreaMinX = 0m
**.mobility.constraintAreaMinY = 0m
**.mobility.constraintAreaMinZ = 0m
**.mobility.constraintAreaMaxX = 3000m
**.mobility.constraintAreaMaxY = 600m
**.mobility.constraintAreaMaxZ = 0m
**.mobility.initFromDisplayString = false
*.configurator.config = xmldoc("./demo.xml")

# ----------------------------------------------------------------------------
[Config Base]
network = simu5g.simulations.LTE.networks.SingleCell
*.ue[*].numApps = 1
*.server.numApps = ${numUEs}
**.ue[*].macCellId = 1
**.ue[*].masterId  = 1

# eNB à gauche, UE alignés vers la droite : ue[k] à 100 + 250·k mètres (200 m → 2450 m)
*.eNB.mobility.initialX = 100m
*.eNB.mobility.initialY = 300m
*.ue[*].mobility.typename = "StationaryMobility"
*.ue[*].mobility.initialX = 100m + 100m + 250m * ancestorIndex(1)
*.ue[*].mobility.initialY = 300m

# Trafic CBR descendant SATURANT : 1000 octets toutes les 2 ms = 4 Mbit/s par UE
*.ue[*].app[0].typename = "CbrReceiver"
*.ue[*].app[0].localPort = 1000
*.server.app[*].typename = "CbrSender"
*.server.app[*].destAddress = "ue[" + string(ancestorIndex(0)) + "]"
*.server.app[*].destPort = 1000
*.server.app[*].localPort = 3088 + ancestorIndex(0)
*.server.app[*].packetSize = 1000B
*.server.app[*].sampling_time = 0.002s
*.server.app[*].startTime = uniform(0s, 0.02s)

# ----------------------------------------------------------------------------
# Exercice 2-3 : les trois ordonnanceurs, 10 UE
[Config Sched]
extends = Base
*.numUe = ${numUEs=10}
**.mac.schedulingDisciplineDl = ${sched = "MAXCI", "PF", "DRR"}

# Exercice 4 : montée en charge (12 runs = 3 schedulers x 4 charges)
[Config Charge]
extends = Base
**.mac.schedulingDisciplineDl = ${sched = "MAXCI", "PF", "DRR"}
*.numUe = ${numUEs = 5, 10, 20, 40}
*.ue[*].mobility.initialX = 100m + 100m + (2250m / ${numUEs}) * ancestorIndex(1)   # même étalement 200-2450 m

# Exercice 5 (optionnel) : trafic mixte — UE pairs en VoIP, UE impairs en CBR saturant
# (dans OMNeT++, la PREMIÈRE ligne qui correspond l'emporte : les règles spécifiques viennent avant)
[Config Mixte]
extends = Base
*.numUe = ${numUEs=10}
**.mac.schedulingDisciplineDl = ${sched = "MAXCI", "PF", "DRR"}
*.ue[0].app[0].typename = "VoIPReceiver"
*.ue[2].app[0].typename = "VoIPReceiver"
*.ue[4].app[0].typename = "VoIPReceiver"
*.ue[6].app[0].typename = "VoIPReceiver"
*.ue[8].app[0].typename = "VoIPReceiver"
*.server.app[0].typename = "VoIPSender"
*.server.app[2].typename = "VoIPSender"
*.server.app[4].typename = "VoIPSender"
*.server.app[6].typename = "VoIPSender"
*.server.app[8].typename = "VoIPSender"
*.server.app[0].packetSize = 40B
*.server.app[2].packetSize = 40B
*.server.app[4].packetSize = 40B
*.server.app[6].packetSize = 40B
*.server.app[8].packetSize = 40B
