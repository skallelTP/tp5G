# ============================================================================
#  TP2 — Prise en main de Simu5G : une cellule LTE, trafic VoIP
#  Réseau : simu5g.simulations.LTE.networks.SingleCell (eNB + N UE + serveur)
#  Lancer :   tp-run SingleCell-DL           (1 run)
#             tp-run Charge-DL 0..4           (balayage numUEs, 5 runs)
#  Exporter : tp-export results results.csv
# ============================================================================
[General]
print-undisposed = false
**.routingRecorder.enabled = false
**.vector-recording = false           # passer à true pour tracer des séries temporelles (fichiers plus gros)

sim-time-limit = 10s
warmup-period  = 2s                   # on ignore les 2 premières secondes dans les moyennes
repeat = 1
seed-set = ${repetition}

# --- Enregistrement des résultats : un dossier par config, un fichier par run
output-scalar-file = ${resultdir}/${configname}/${iterationvars}-${repetition}.sca
output-vector-file = ${resultdir}/${configname}/${iterationvars}-${repetition}.vec

# --- Couche physique / MAC
**.numBands = 25                      # 25 RB = 5 MHz LTE  (essayez 50 = 10 MHz, 100 = 20 MHz)
**.rbAllocationType = "localized"
**.eNodeBTxPower = 40dBm
**.ueTxPower = 26dBm
**.targetBler = 0.01
**.mac.schedulingDisciplineDl = "MAXCI"   # DRR | PF | MAXCI   (TP3 : on comparera)
**.mac.schedulingDisciplineUl = "MAXCI"

# --- Mobilité : zone 600 m x 600 m, eNB au centre
**.mobility.constraintAreaMinX = 0m
**.mobility.constraintAreaMinY = 0m
**.mobility.constraintAreaMinZ = 0m
**.mobility.constraintAreaMaxX = 600m
**.mobility.constraintAreaMaxY = 600m
**.mobility.constraintAreaMaxZ = 0m
**.mobility.initFromDisplayString = false

*.configurator.config = xmldoc("./demo.xml")

# ----------------------------------------------------------------------------
[Config SingleCell]
network = simu5g.simulations.LTE.networks.SingleCell
*.numUe = ${numUEs=5}

*.ue[*].numApps = 1
*.server.numApps = ${numUEs}          # une appli serveur par UE

**.ue[*].macCellId = 1                # rattachement des UE à l'eNB n°1
**.ue[*].masterId  = 1

*.eNB.mobility.initialX = 300m
*.eNB.mobility.initialY = 300m
*.ue[*].mobility.typename = "StationaryMobility"
*.ue[*].mobility.initialX = uniform(0m, 600m)
*.ue[*].mobility.initialY = uniform(0m, 600m)

# ----------------------------------------------------------------------------
# Trafic VoIP descendant (serveur -> UE)
[Config SingleCell-DL]
extends = SingleCell
*.ue[*].app[0].typename = "VoIPReceiver"
*.ue[*].app[0].localPort = 3000
*.server.app[*].typename = "VoIPSender"
*.server.app[*].destAddress = "ue[" + string(ancestorIndex(0)) + "]"
*.server.app[*].destPort = 3000
*.server.app[*].localPort = 3088 + ancestorIndex(0)
*.server.app[*].startTime = uniform(0s, 0.02s)

# Trafic VoIP montant (UE -> serveur)
[Config SingleCell-UL]
extends = SingleCell
*.server.app[*].typename = "VoIPReceiver"
*.server.app[*].localPort = 3000 + ancestorIndex(0)
*.ue[*].app[0].typename = "VoIPSender"
*.ue[*].app[0].destAddress = "server"
*.ue[*].app[0].destPort = 3000 + ancestorIndex(1)
*.ue[*].app[0].localPort = 3088
*.ue[*].app[0].startTime = uniform(0s, 0.02s)

# ----------------------------------------------------------------------------
# Exercice 3 : balayage de la charge (5 runs : -r 0..4)
[Config Charge-DL]
extends = SingleCell-DL
*.numUe = ${numUEs=5, 20, 50, 100, 150}

# Exercice 4 : UE en mouvement (vitesse en m/s)
[Config Mobile-DL]
extends = SingleCell-DL
*.numUe = ${numUEs=20}
*.ue[*].mobility.typename = "LinearMobility"
*.ue[*].mobility.speed = ${speed=1, 5, 15, 30}mps
